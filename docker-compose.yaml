version: '3.8'

services:
  ai-virtual-human:
    build: .
    container_name: ai-virtual-human
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file:
      - .env
    depends_on:
      cosyvoice-service:
        condition: service_healthy
      indextts-service:
        condition: service_healthy
      sensevoice-service:
        condition: service_healthy
    restart: always
    working_dir: /app
    command: python web_demo/server.py

  cosyvoice-service:
    build: ./cosyvoice-service
    container_name: cosyvoice-service
    ports:
      - "50001:50001"
    volumes:
      - ./cosyvoice-service/models:/app/models
      - ./cosyvoice-service/config:/app/config
    environment:
      - MODEL_DIR=./models/trained_models20250801/cosyvoice2/
      - PORT=50001
      - PYTHONPATH=/app:/app/third_party/Matcha-TTS
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
    working_dir: /app
    command: python3 runtime/python/fastapi/server.py --port 50001 --model_dir ./models/trained_models20250801/cosyvoice2/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50001/voices"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  indextts-service:
    build: ./indextts-service
    container_name: indextts-service
    ports:
      - "6008:6008"
    volumes:
      - ./indextts-service:/app
      - ./indextts-service/config:/app/config
      - ./indextts-service/checkpoints:/app/checkpoints  # 模型持久化存儲
      - ./indextts-service/outputs:/app/outputs
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
    working_dir: /app
    command: python api.py --port 6008 --host 0.0.0.0 --model_dir checkpoints
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6008/docs"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s  # 增加啟動時間，因為可能需要下載模型

  sensevoice-service:
    build: ./sensevoice-service
    container_name: sensevoice-service
    ports:
      - "50002:50002"
    volumes:
      - ./sensevoice-service:/app
      - ./sensevoice-service/models:/app/models  # 模型持久化存儲
    environment:
      - SENSEVOICE_DEVICE=cuda:0
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
    working_dir: /app
    command: uvicorn api:app --host 0.0.0.0 --port 50002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50002/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s  # SenseVoice 模型載入需要較長時間
