version: '3.8'

services:
  ai-virtual-human:
    build: .
    container_name: ai-virtual-human
    ports:
      - "8888:8888"
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    env_file:
      - .env
    depends_on:
      cosyvoice-service:
        condition: service_healthy
      indextts-service:
        condition: service_healthy
      sensevoice-service:
        condition: service_healthy
    restart: always
    working_dir: /app
    command: python web_demo/server.py

  cosyvoice-service:
    build: ./cosyvoice-service
    container_name: cosyvoice-service
    ports:
      - "50001:50001"
      - "8085:8085"
    volumes:
      - ./cosyvoice-service:/opt/CosyVoice
      - ./cosyvoice-service/models:/opt/CosyVoice/models
      - ./cosyvoice-service/config:/opt/CosyVoice/config
    environment:
      - MODEL_DIR=/opt/CosyVoice/models/trained_models_naer_20251208/cosyvoice2
      - PORT=50001
      - ENABLE_VLLM=true
      - PYTHONPATH=/opt/CosyVoice:/opt/CosyVoice/third_party/Matcha-TTS
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
    working_dir: /opt/CosyVoice
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:50001/voices', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  indextts-service:
    build: ./indextts-service
    container_name: indextts-service
    ports:
      - "8001:8001"
    volumes:
      - ./indextts-service/audio_prompts:/app/audio_prompts
      - ./indextts-service/assets:/app/assets
      - ./indextts-service/checkpoints:/app/checkpoints
      - ./indextts-service/logs:/app/logs
    environment:
      - MODEL=IndexTeam/IndexTTS-1.5
      - VLLM_USE_MODELSCOPE=1
      - DOWNLOAD_MODEL=1
      - CONVERT_MODEL=1
      - MODEL_DIR=checkpoints
      - PORT=8001
      - GPU_MEMORY_UTILIZATION=0.1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 1800s  # VLLM 需要更長的啟動時間

  sensevoice-service:
    build: ./sensevoice-service
    container_name: sensevoice-service
    ports:
      - "50002:50002"
    volumes:
      - ./sensevoice-service:/app
      - ./sensevoice-service/models:/app/models  # 模型持久化存儲
    environment:
      - SENSEVOICE_DEVICE=cuda:0
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: always
    working_dir: /app
    command: uvicorn api:app --host 0.0.0.0 --port 50002
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:50002/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s  # SenseVoice 模型載入需要較長時間
